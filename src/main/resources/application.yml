spring:
  jpa:
    hibernate:
      ddl-auto: update
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    serialization:
      FAIL_ON_EMPTY_BEANS: false
  web:
    resources:
      static-locations: classpath:/static/
      add-mappings: true
      cache:
        period: 0
  mvc:
    static-path-pattern: /**

server:
  port: 8080

application:
  security:
    jwt:
      expiration: 86400000
      refresh-token:
        expiration: 604800000

imagekit:
  url-endpoint: https://ik.imagekit.io/3xkfdetno

